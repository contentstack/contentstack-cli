name: Release
on:
  push:
    branches:
      - master
jobs:
  build:
    name: Build and upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Recommended update to v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4 # Recommended update to v4
        with:
          node-version: "18.x"
      - name: Install dependencies
        run: npm install
      - name: Upload dist
        uses: actions/upload-artifact@v4 # UPDATED: Changed from v3 to v4
        with:
          name: lib
          path: lib

  release:
    name: Download dist and release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Recommended update to v4
        with:
          fetch-depth: 0
      - name: Download dist
        uses: actions/download-artifact@v4 # UPDATED: Changed from v3 to v4
        with:
          name: lib
          path: lib
      - name: Display directories
        run: ls -R lib
      - name: Publish to npm
        id: release-plugin
        uses: JS-DevTools/npm-publish@v2.2.0
        with:
          token: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v${{ steps.release-plugin.outputs.version }} --title "Release ${{ steps.release-plugin.outputs.version }}" --generate-notes